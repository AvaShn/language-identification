text:
  raw_source: data/raw/text
  glob: '**/*.txt'
  encoding: utf-8
  group_regex: '^(\d{9})_'
  language_names:
    de: german
    es: spanish
    it: italian
    ko: korean
    po: portuguese
    ja: japanese
  test_size: 0.3333333333333333
  cv_folds: 5
  select_k_best: 50
  tfidf:
    character:
      analyzer: char_wb
      ngram_range: [2, 4]
      min_df: 1
      max_features: 3000
      sublinear_tf: true
      lowercase: true
    word:
      analyzer: word
      ngram_range: [1, 2]
      min_df: 1
      max_features: 2000
      sublinear_tf: true
      lowercase: true
  clustering_svd_components: 50
  cluster_k_min: 2
  cluster_k_max: 8
